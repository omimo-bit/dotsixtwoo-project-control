<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#FFFF00" />
  <title>DOTSIXTWOO Project Control</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <section id="loginView" class="center-page">
      <div class="auth-card">
        <div class="brand-row">
          <img src="assets/logo.png" alt="DOTSIXTWOO" class="logo" onerror="this.style.display='none'">
          <div>
            <div class="eyebrow">DOTSIXTWOO</div>
            <h1>Project Control Center</h1>
          </div>
        </div>
        <p class="muted">Masuk untuk melihat project, task, meeting, MOM, dan budget.</p>
        <form id="loginForm">
          <label>Email<input id="email" type="email" required autocomplete="username"></label>
          <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
          <button class="btn primary" type="submit">Masuk</button>
          <p id="loginMsg" class="msg"></p>
        </form>
      </div>
    </section>

    <section id="mainView" class="hidden">
      <header class="topbar">
        <div class="brand-row compact">
          <img src="assets/logo.png" alt="DOTSIXTWOO" class="logo small" onerror="this.style.display='none'">
          <div><strong>DOTSIXTWOO</strong><span id="userRole" class="muted tiny"></span></div>
        </div>
        <button id="logoutBtn" class="btn ghost">Keluar</button>
      </header>

      <main class="content">
        <section data-page="home" class="page active">
          <div class="welcome"><h2 id="welcomeText">Halo</h2><p class="muted">Ringkasan hari ini.</p></div>
          <div id="metrics" class="metric-grid"></div>
          <div class="section-head"><h3>Task Saya</h3><button class="btn small" data-go="tasks">Lihat semua</button></div>
          <div id="homeTasks" class="stack"></div>
          <div class="section-head"><h3>Meeting Hari Ini</h3><button class="btn small" data-go="meetings">Lihat semua</button></div>
          <div id="todayMeetings" class="stack"></div>
        </section>

        <section data-page="projects" class="page">
          <div class="section-head"><h2>Projects</h2><button id="newProjectBtn" class="btn primary small">+ Project</button></div>
          <input id="projectSearch" class="search" placeholder="Cari project / client / brand...">
          <div id="projectList" class="stack"></div>
        </section>

        <section data-page="tasks" class="page">
          <div class="section-head"><h2>My Tasks</h2><button id="newTaskBtn" class="btn primary small">+ Task</button></div>
          <div class="chips" id="taskFilters"></div>
          <div id="taskList" class="stack"></div>
        </section>

        <section data-page="meetings" class="page">
          <div class="section-head"><h2>Meeting & MOM</h2><button id="newMeetingBtn" class="btn primary small">+ Meeting</button></div>
          <div id="meetingList" class="stack"></div>
        </section>

        <section data-page="more" class="page">
          <h2>More</h2>
          <div class="menu-card"><button data-go="budget">Budget</button><button data-go="activity">Activity Log</button><button data-go="schedule">Alfa's Schedule</button></div>
        </section>

        <section data-page="budget" class="page"><div class="section-head"><h2>Budget</h2><button class="btn small" data-go="more">Kembali</button></div><div id="budgetList" class="stack"></div></section>
        <section data-page="activity" class="page"><div class="section-head"><h2>Activity Log</h2><button class="btn small" data-go="more">Kembali</button></div><div id="activityList" class="stack"></div></section>
        <section data-page="schedule" class="page"><div class="section-head"><h2>Alfa's Schedule</h2><button class="btn small" data-go="more">Kembali</button></div><div id="scheduleList" class="stack"></div></section>
      </main>

      <nav class="bottom-nav">
        <button data-go="home" class="active">Home</button><button data-go="projects">Projects</button><button data-go="tasks">Tasks</button><button data-go="meetings">Meeting</button><button data-go="more">More</button>
      </nav>
    </section>
  </div>

  <dialog id="modal"><form method="dialog" id="modalForm" class="modal-card"><div class="section-head"><h3 id="modalTitle">Form</h3><button value="cancel" class="btn ghost">✕</button></div><div id="modalBody"></div><menu><button value="cancel" class="btn ghost">Batal</button><button id="modalSave" value="default" class="btn primary">Simpan</button></menu></form></dialog>

  <script src="js/config.js"></script><script src="js/api.js"></script><script src="js/app.js"></script>
</body>
</html>
